# Caddy terminates HTTPS for TOE3_DOMAIN and obtains its certificate automatically.
services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "${TOE3_HTTP_PORT:-80}:80"
      - "${TOE3_HTTPS_PORT:-443}:443"
      - "${TOE3_HTTPS_PORT:-443}:443/udp"
    environment:
      TOE3_DOMAIN: ${TOE3_DOMAIN:?set TOE3_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
